<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV interactif</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <!-- Les boutons du menu, en haut de la page.
       data-section doit correspondre à un nom dans script.js -->
  <nav id="menu" aria-label="Menu principal">
    <button data-section="accueil">Accueil</button>
    <button data-section="competences">Compétences</button>
    <button data-section="projets">Mes projets</button>
    <button data-section="experiences">Expériences</button>
    <button data-section="loisirs">Loisirs</button>
    <button data-section="contact">Contact/Réseau</button>
  </nav>

  <!-- Au milieu : le contenu. Sur les côtés : les photos empilées. -->
  <div class="page">
    <aside class="cote gauche" id="cote-gauche" aria-label="Photos"></aside>
    <main id="contenu" tabindex="-1"></main>
    <aside class="cote droite" id="cote-droite" aria-label="Photos"></aside>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
